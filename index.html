<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f6f5c" />
    <meta name="description" content="Convertor de tarif și calculator de taxe 2026 pentru freelancerii din România." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- iOS ignores SVG icons on the home screen. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Freelancing" />
    <!-- Link previews (WhatsApp, Slack, social networks). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FreelancingToolkit" />
    <meta property="og:description" content="Convertor de tarif și calculator de taxe 2026 pentru freelancerii din România." />
    <meta property="og:url" content="https://romulusmirauta.github.io/FreelancingToolkit/" />
    <meta property="og:image" content="https://romulusmirauta.github.io/FreelancingToolkit/icon-512.png" />
    <meta property="og:locale" content="ro_RO" />
    <meta name="twitter:card" content="summary" />
    <title>FreelancingToolkit</title>
    <script>
      // Before the page paints, so it never flashes the wrong theme: the address (?theme=) first, then the saved one.
      // The address is read as the app reads it (THEME_QUERY in appQueries.ts): ?theme=auto, ?theme=Dark.
      try {
        var q = new URLSearchParams(location.search).get('theme');
        if (q) q = q === 'auto' ? 'system' : q.toLowerCase();
        var t = q === 'light' || q === 'dark' || q === 'system' ? q : JSON.parse(localStorage.getItem('ft.theme'));
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
