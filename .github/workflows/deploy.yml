name: Deploy

on:
  push:
    branches: [main]
  # BNR publishes reference rates on banking days at about 13:00 Romanian time (10:00–11:00 UTC).
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

# Read-only unless a job asks for more: each one gets only what its own steps need.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to push the new rates; only the commit step has the token in its environment
      pages: read # configure-pages reads the site's settings
    steps:
      # Without the token in .git/config, the packages npm installs and runs can't push.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Refresh BNR and market rates (keeps the committed snapshots on failure)
        run: npm run rates
      # Tests and build run on the fresh rates. If either fails, nothing is committed or deployed,
      # and GitHub Pages keeps serving the last good version.
      # The linters only look at the code, which a scheduled run doesn't change: they never hold up new rates.
      - if: github.event_name != 'schedule'
        run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit the new rates snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet -- src/data/rates.json src/data/market-rates.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Update exchange rates" -- src/data/rates.json src/data/market-rates.json
            remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # A pull that rebases names its reflog entries after its own command line, token included, unless this is set.
            GIT_REFLOG_ACTION='pull --rebase' git pull --rebase --autostash "$remote" "$GITHUB_REF"
            git push "$remote" "HEAD:$GITHUB_REF"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # npm run rates keeps the saved rates when a download fails or looks wrong, so that new code still deploys. Once they
  # are older than BNR's holidays or a missed update explain (a source that moved or stopped answering), this job fails
  # the run, after the deploy, and GitHub emails the owner.
  freshness:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The branch as the build job left it, with the rates it committed.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: node scripts/check-rates-age.mjs
